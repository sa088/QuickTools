<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cosmic Royal-to-Violet Background Gradient -->
    <linearGradient id="qtFavBg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="38%" stop-color="#6366F1" />
      <stop offset="72%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Electric Radiant Gold/Amber Lightning Gradient -->
    <linearGradient id="qtFavBolt" x1="32" y1="20" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="28%" stop-color="#FACC15" />
      <stop offset="68%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Glass Gloss Sheen Gradient -->
    <linearGradient id="qtFavGlass" x1="10" y1="4" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Border Specular Gradient -->
    <linearGradient id="qtFavStroke" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#A5B4FC" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.15" />
    </linearGradient>

    <!-- Subtle Outer Drop Shadow -->
    <filter id="qtFavGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#qtFavBg)" filter="url(#qtFavGlow)" />

  <!-- Specular Inner Stroke -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="16.5" fill="none" stroke="url(#qtFavStroke)" stroke-width="1.2" />

  <!-- Upper Half Glass Reflection Curve -->
  <path d="M 3.5 20 C 3.5 11 11 3.5 20 3.5 L 44 3.5 C 53 3.5 60.5 11 60.5 20 C 48 24 24 26 3.5 20 Z" fill="url(#qtFavGlass)" />

  <!-- Top Calculator Display Bar (Mini Digital HUD) -->
  <rect x="13" y="11.5" width="38" height="7.5" rx="3.75" fill="#090D1A" fill-opacity="0.5" />
  <rect x="15.5" y="13.2" width="7" height="4" rx="2" fill="#38BDF8" />
  <circle cx="27" cy="15.2" r="2" fill="#34D399" />
  <circle cx="33" cy="15.2" r="2" fill="#F43F5E" />
  <rect x="38" y="13.2" width="10.5" height="4" rx="2" fill="#F8FAFC" fill-opacity="0.85" />

  <!-- Precision Math Glyph: Bold Plus (+) in Top-Left -->
  <path d="M 22 26 L 22 34 M 18 30 L 26 30" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Math Glyph: Bold Percentage (%) in Mid-Left -->
  <circle cx="18" cy="42" r="2.2" fill="#E0E7FF" />
  <circle cx="25" cy="50" r="2.2" fill="#E0E7FF" />
  <path d="M 26 41 L 17 51" stroke="#E0E7FF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Precision Math Glyph: Neon Equals (=) in Cyan -->
  <line x1="16" y1="56" x2="27" y2="56" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Dynamic Electric Speed Bolt (Fast calculation engine) -->
  <path d="M 44 24 L 32.5 39.5 L 40 39.5 L 36 53.5 L 51.5 35.5 L 43.5 35.5 Z" 
        fill="url(#qtFavBolt)" 
        stroke="#FFFFFF" 
        stroke-width="1.2" 
        stroke-linejoin="round" />

  <!-- Core Electric Flash Highlight in Center of Bolt -->
  <path d="M 42 27 L 35 38 L 40 38 L 38 47 L 46 36 L 41.5 36 Z" fill="#FFFFFF" fill-opacity="0.45" />

  <!-- Micro Spark / Energy Dot -->
  <circle cx="51" cy="23" r="1.5" fill="#FEF08A" />
</svg>
